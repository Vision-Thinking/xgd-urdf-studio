map $uri $urdf_studio_cache_control {
    default                                  "no-cache";
    ~^/(assets|fonts|logos)/                 "public, max-age=31536000, immutable";
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # USD 的 Emscripten pthread runtime 依赖安全上下文和跨源隔离。
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $urdf_studio_cache_control always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Worker、WASM 与构建产物缺失时必须返回 404，不能被 SPA fallback
    # 替换成 index.html，否则浏览器只会报告难以定位的 MIME/编译错误。
    location ^~ /assets/ {
        try_files $uri =404;
    }

    location ^~ /usd/bindings/ {
        try_files $uri =404;
    }

    location ^~ /configuration/ {
        try_files $uri =404;
    }

    location ^~ /fonts/ {
        try_files $uri =404;
    }

    location ^~ /logos/ {
        try_files $uri =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
